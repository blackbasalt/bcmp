services:
  web:
    build: .
    image: bcmp:latest
    container_name: bcmp
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite lives in the persisted bind-mounted data/ dir, not the image
      SQLITE_PATH: /bcmp/data/db.sqlite3
      # Uploaded поэтажные планы live beside it, for the same reason
      MEDIA_ROOT: /bcmp/media
    volumes:
      - ./data:/bcmp/data                # persisted database
      - ./media:/bcmp/media              # uploaded планы, served by the app, never by nginx
      - ./staticfiles:/bcmp/staticfiles  # collected static, served by host nginx
    ports:
      # Bound to loopback only; host nginx reverse-proxies to it
      - "127.0.0.1:8000:8000"
